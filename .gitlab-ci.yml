ray-serve-boot-up:
  stage: e2e-test
  image: alpine/k8s:1.24.9
  tags:
    - "kos-deep-pack-runner"
    - "kao-products"

  needs: [ deploy ]
  when: manual
  except:
    refs:
     - master
     - develop
     - /^release.*/
     - schedules
  before_script:

    - export RELEASE_NAME=$(eval "echo ${CI_COMMIT_REF_SLUG:0:15} | sed 's/-*$//'")
    - cd $CI_PROJECT_DIR/e2e-tests/api-tests

  script:
     # wait for ray-serve to boot up
    - |
      export POD_STATUS=""
      until [ "$POD_STATUS" == "Running" ]; do
         export POD_STATUS=$(kubectl get pods --namespace deep-pack -l "app=ray-serve,release=$RELEASE_NAME" -o jsonpath="{.items[0].status.phase}")
         echo "ray serve status:$POD_STATUS"
         sleep 2
      done


ray-serve-beta-boot-up:
  stage: e2e-test
  image: alpine/k8s:1.24.9
  tags:
    - staging
    - gcp
  needs: [deploy-preprod]
  only:
     - master
  script:
     # wait for ray-serve to boot up
    - |
      export POD_STATUS=""
      until [ "$POD_STATUS" == "Running" ]; do
         export POD_STATUS=$(kubectl get pods --namespace deep-pack -l "app=ray-serve,release=gcp-beta" -o jsonpath="{.items[0].status.phase}")
         echo "ray serve status:$POD_STATUS"
         sleep 2
      done

ray-serve-boot-up-nightly:
  stage: e2e-test
  image: alpine/k8s:1.24.9
  tags:
    - "kos-deep-pack-runner"
    - "kao-products"
  before_script:

    - cd $CI_PROJECT_DIR/e2e-tests/api-tests

  script:
     # install wildcard TLS certificate
    - kubectl apply -f ../../deployment/infra/deeppack-wildcard-ai-cert.yaml --namespace deep-pack
     # wait for ray-serve to boot up
    - |
      export POD_STATUS=""
      until [ "$POD_STATUS" == "Running" ]; do
         export POD_STATUS=$(kubectl get pods --namespace deep-pack -l "app=ray-serve,release=ray-serve-develop" -o jsonpath="{.items[0].status.phase}")
         echo "ray serve status:$POD_STATUS"
         sleep 2
      done
  rules:
    - if: $SCHEDULE_TIME == "nightly"